# yaml-language-server: $schema=../../../dist/honeybadger.json
%YAML 1.1
---
api_key: "abc123"
env: production
report_data: true
root: "/app"
revision: "a1b2c3d4"
hostname: "web-01"
debug: false
send_data_at_exit: true
max_queue_size: 100
logging:
  path: "/var/log/honeybadger.log"
  level: "INFO"
connection:
  secure: true
  host: "api.honeybadger.io"
  port: 443
  http_open_timeout: 2
  http_read_timeout: 5
request:
  filter_keys:
    - "password"
    - "credit_card"
  disable_session: false
  disable_params: false
  disable_environment: false
  disable_url: false
exceptions:
  enabled: true
  ignore:
    - "ActiveRecord::RecordNotFound"
    - "ActionController::RoutingError"
  ignored_user_agents:
    - "Googlebot"
  notify_at_exit: true
  source_radius: 3
  local_variables: false
  unwrap: false
breadcrumbs:
  enabled: true
  logging:
    enabled: true
development_environments:
  - development
  - test
sync: false
skipped_plugins:
  - passenger
events:
  batch_size: 500
  timeout: 10000
  sample_rate: 50
  ignore:
    - sql.active_record
    - event_type: process_action.action_controller
      controller: Rails::HealthController
sql:
  max_length: 500000
insights:
  enabled: true
  console:
    enabled: false
  registry_flush_interval: 60
puma:
  insights:
    enabled: true
    collection_interval: 1
ruby_llm:
  insights:
    subscriber: MyRubyLLMSubscriber
sidekiq:
  attempt_threshold: 3
  insights:
    collection_interval: 5
    metrics: true
resque:
  resque_retry:
    send_exceptions_when_retrying: false

production:
  logging:
    level: warn
    debug: false
  connection:
    ui_host: "app.honeybadger.io"
    system_ssl_cert_chain: true
  exceptions:
    backtrace_limit: 500
