# yaml-language-server: $schema=../../../../dist/rails/recurring.json
%YAML 1.1
---
production:
  periodic_cleanup:
    class: CleanupJob
    schedule: every day at 2am
    queue: maintenance
    priority: 5
  send_weekly_digest:
    class: WeeklyDigestJob
    schedule: every Monday at 9am
    queue: mailers
    priority: 10
  database_backup:
    command: "Backup.perform"
    schedule: every 6 hours
    queue: critical
    priority: 0
  a_periodic_job:
    class: MyJob
    args: [42, { status: "custom_status" }]
    schedule: every second
    description: Runs MyJob with a custom status
  my_periodic_resque_job:
    class: Reports::NightlyExport
    args: 22
    schedule: "*/5 * * * *"
  batch_maintenance:
    command: "SolidQueue::Batch.sweep_stalled"
    schedule: every 5 minutes
    description: Sweep stalled batches
