# yaml-language-server: $schema=../../../dist/i18n-tasks.json
%YAML 1.1
---
base_locale: en
internal_locale: en
locales:
  - en
  - fr
  - de
  - ja
data:
  adapter: I18n::Tasks::Data::FileSystem
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/%{locale}.yml
  write:
    - "config/locales/%{locale}.yml"
    - - "{devise}.*"
      - "config/locales/devise.%{locale}.yml"
  router: conservative_router
  keep_order: true
  external:
    - "<%=`bundle show gema`.chomp%>/config/locales/%{locale}.yml"
  yaml:
    write:
      line_width: -1
  json:
    write:
      indent: "  "
      space: " "
      object_nl: "\n"
      array_nl: "\n"
search:
  paths:
    - app/
    - lib/
  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/presenters
    - app/views
  relative_exclude_method_name_paths:
    - app/assets
  exclude:
    - app/assets/images
    - app/assets/fonts
  only:
    - "*.rb"
    - "*.html.erb"
  strict: false
  prism: rails
  ast_matchers:
    - I18n::Tasks::Scanners::AstMatchers::RailsModelMatcher
    - I18n::Tasks::Scanners::AstMatchers::DefaultI18nSubjectMatcher
  scanners:
    - ["::I18n::Tasks::Scanners::RubyScanner", { only: ["*.rb"] }]
    - ["::I18n::Tasks::Scanners::PatternWithScopeScanner", { exclude: ["*.erb", "*.rb"] }]
translation:
  backend: deepl
  deepl_api_key: "abc123"
  deepl_options:
    formality: prefer_less
  openai_api_key: "sk-abc123"
  openai_model: gpt-4o-mini
  openai_temperature: 0.0
  openai_system_prompt: >-
    You are a professional translator that translates content from the %{from} locale
    to the %{to} locale in an i18n locale array.
  openai_locale_prompts:
    es: Translate from %{from} to Latin American Spanish.
ignore_missing:
  - "errors.messages.{accepted,blank,invalid,too_short,too_long}"
  - "{devise,simple_form}.*"
ignore_unused:
  - "activerecord.attributes.*"
ignore_eq_base:
  all:
    - common.ok
  fr,es:
    - common.brand
ignore_inconsistent_interpolations:
  - "activerecord.attributes.*"
ignore:
  - kaminari.*
