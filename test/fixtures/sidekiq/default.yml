# yaml-language-server: $schema=../../../dist/sidekiq.json
%YAML 1.1
---
concurrency: 10
timeout: 25
verbose: false
tag: myapp
labels:
  - reports
queues:
  - [critical, 5]
  - [default, 3]
  - [mailers, 2]
  - low
capsules:
  unsafe:
    concurrency: 1
    queues:
      - thread_unsafe
max_retries: 10
dead_max_jobs: 5000
max_iteration_runtime: 600
redis_idle_timeout: 60
logged_job_attributes:
  - bid
  - tags
  - tenant
production:
  concurrency: 20
staging:
  concurrency: 5
  queues:
    - critical,2
    - default,1
