# yaml-language-server: $schema=../../../dist/rubocop.json
%YAML 1.1
---
inherit_from: .rubocop_todo.yml

inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-performance
  - rubocop-rails:
      require_path: rubocop-rails
      plugin_class_name: RuboCop::Rails::Plugin

require:
  - ./lib/custom_cops

inherit_mode:
  merge:
    - Exclude
    - AllowedMethods
  override:
    - Include

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  FailLevel: warning
  Preview: true
  UseProjectIndex: true
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
  DisabledByDefault: false
  StyleGuideBaseURL: https://rubystyle.guide
  TargetRailsVersion: 8.0

Layout:
  Enabled: true

Layout/LineLength:
  Enabled: true
  Max: 120
  AllowHeredoc: true
  AllowURI: true
  URISchemes:
    - http
    - https
  AllowCopDirectives: true
  AllowedPatterns:
    - "^# "

Layout/IndentationWidth:
  Width: 2

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space

Layout/EmptyLineAfterMagicComment:
  NumberOfEmptyLines: 2

Layout/EmptyLinesAroundClassBody:
  EnforcedStyle: no_empty_lines

Layout/HashAlignment:
  AllowMultipleStyles: true
  EnforcedColonStyle:
    - key
    - table

Layout/MultilineAssignmentLayout:
  SupportedTypes:
    - block
    - if

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Lint:
  Enabled: true
  NewCops: "1.88"

Lint/AmbiguousBlockAssociation:
  AllowedMethods:
    - change
    - not_change

Lint/Debugger:
  DebuggerMethods:
    WebConsole: ~
    MyDebugger:
      - MyDebugger.debug_this
  DebuggerRequires:
    - debug/start

Lint/MissingCopEnableDirective:
  MaxRangeSize: 10

Lint/SuppressedException:
  AllowComments: true
  AllowNil: true

Lint/UnusedPrivateMethod:
  Enabled: true
  AllowedNames:
    - respond_to_missing?

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
  IgnoreEmptyMethods: true

Metrics:
  Enabled: true

Metrics/AbcSize:
  Max: 25
  AllowedMethods:
    - create
  CountRepeatedAttributes: false

Metrics/MethodLength:
  Max: 20
  CountComments: false
  CountAsOne:
    - array
    - hash
    - heredoc

Metrics/BlockLength:
  CountComments: false
  Max: 30
  AllowedMethods:
    - describe
    - context
    - it
  AllowedPatterns:
    - "^configure"

Naming/MethodName:
  EnforcedStyle: snake_case

Naming/VariableName:
  EnforcedStyle: snake_case

Style:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes
  ConsistentQuotesInMultiline: true

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/HashSyntax:
  EnforcedStyle: ruby19
  EnforcedShorthandSyntax: always

Style/Documentation:
  Enabled: false

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Style/SymbolArray:
  EnforcedStyle: brackets
  MinSize: 0

Style/WordArray:
  EnforcedStyle: brackets
  MinSize: 0

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
  AllowWithReason: true
  AllowedDirectives:
    - todo

Style/ModuleFunction:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "lib/legacy/**/*"
  Safe: true
  SafeAutoCorrect: false
  References:
    - https://example.com/module-function

Style/RedundantArgument:
  Methods:
    join: ""
    to_i: 10
    exit: true

Style/SingleLineBlockParams:
  Enabled: true
  Methods:
    - reduce:
        - acc
        - elem

Style/YodaExpression:
  Enabled: true
  SupportedOperators:
    - "*"
    - "+"

Style/MutableConstant:
  Recursive: true

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Bundler/OrderedGems:
  Enabled: true
  TreatCommentsAsGroupSeparators: true
  ConsiderPunctuation: false

Bundler/GemVersion:
  EnforcedStyle: required
  AllowedGems:
    - rails
