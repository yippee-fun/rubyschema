# yaml-language-server: $schema=../../../dist/mongoid.json
%YAML 1.1
---
development:
  clients:
    default:
      database: my_app_development
      hosts:
        - localhost:27017
      options:
        read:
          mode: primary
        max_pool_size: 5
        min_pool_size: 1
        connect_timeout: 10
        server_selection_timeout: 30
  options:
    log_level: debug
    raise_not_found_error: true
    use_utc: false
    belongs_to_required_by_default: true
    preload_models: false

test:
  clients:
    default:
      database: my_app_test
      hosts:
        - localhost:27017
      options:
        read:
          mode: primary
        max_pool_size: 1
  options:
    raise_not_found_error: true

production:
  clients:
    default:
      uri: mongodb+srv://user:password@cluster0.example.mongodb.net/my_app_production
      options:
        read:
          mode: secondary_preferred
          tag_sets:
            - use: reporting
        write_concern:
          w: majority
          j: true
        read_concern:
          level: majority
        max_pool_size: 20
        max_connecting: 4
        retry_writes: true
        timeout_ms: 5000
        server_api:
          version: "1"
          strict: false
        min_pool_size: 5
        connect_timeout: 15
        wait_queue_timeout: 10
        compressors:
          - zstd
          - snappy
        ssl: true
        ssl_verify: true
        ssl_ca_cert: /etc/ssl/certs/ca-certificates.crt
        truncate_logs: true
    analytics:
      database: my_app_analytics
      hosts:
        - analytics1.example.com:27017
        - analytics2.example.com:27017
      options:
        read:
          mode: ":secondary"
          max_staleness: 120
          tag_sets:
            - datacenter: east
        auth_mech: ":scram256"
        auth_source: admin
        user: analytics_user
        password: secret
        server_monitoring_mode: ":poll"
        replica_set: analytics-rs0
  options:
    app_name: my_app
    log_level: warn
    raise_not_found_error: true
    use_utc: true
    belongs_to_required_by_default: true
    immutable_ids: true
    duplicate_fields_exception: true
    async_query_executor: global_thread_pool
    global_executor_concurrency: 4
    isolation_level: ":fiber"
    map_big_decimal_to_decimal128: true
    allow_unsafe_query_operators: false
    allow_short_circuit_queries: true
    in_memory_regexp_time_limit: 2.5
    preload_models:
      - User
      - Post
  driver_options:
    validate_update_replace: true
    broken_view_aggregate: false
    include_server_address_in_errors: true
