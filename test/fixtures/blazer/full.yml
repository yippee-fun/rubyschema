# yaml-language-server: $schema=../../../dist/blazer.json
%YAML 1.1
---

data_sources:
  main:
    url: <%= ENV["BLAZER_DATABASE_URL"] %>
    name: Production
    timeout: 15
    cache:
      mode: slow
      expires_in: 60
      slow_threshold: 15
    use_transaction: false
    schemas:
      - public
      - reporting
    smart_variables:
      zone_id: "SELECT id, name FROM zones ORDER BY name ASC"
      period: ["day", "week", "month"]
      status: {0: "Active", 1: "Archived"}
    linked_columns:
      user_id: "/admin/users/{value}"
      ip_address: "https://www.infosniper.net/index.php?ip_address={value}"
    smart_columns:
      city_id: "SELECT id, name FROM cities WHERE id IN {value}"
      status: {0: "Active", 1: "Archived"}
    variable_defaults:
      period: day
    local_time_suffix: _local
  replica:
    url: <%= ENV["REPLICA_DATABASE_URL"] %>
    cache: 30
    inherit_smart_settings: [main]
  athena:
    adapter: athena
    database: database
    output_location: s3://some-bucket/
    workgroup: primary
    catalog: s3tablescatalog/some-bucket
    engine_version: 3
    access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
    secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
    region: us-east-1
  bigquery:
    adapter: bigquery
    project: your-project
    keyfile: path/to/keyfile.json
  clickhouse:
    adapter: clickhouse
    url: https://user:password@hostname:8443
    database: default
  snowflake:
    adapter: snowflake2
    account_id: my-account
    database: ANALYTICS
    schema: PUBLIC
    warehouse: COMPUTE_WH
    role: REPORTER
    access_token: <%= ENV["SNOWFLAKE_ACCESS_TOKEN"] %>
  soda:
    adapter: soda
    url: https://soda.demo.socrata.com/resource/4tka-6guv.json
    app_token: <%= ENV["SODA_APP_TOKEN"] %>
  trino:
    url: trino://user@hostname:8080/catalog
  custom:
    adapter: foo
    url: http://user:password@hostname:9200/
    index: logs

audit: false
time_zone: Pacific Time (US & Canada)
user_class: Admin
user_method: current_admin
user_name: email
before_action_method: require_admin
from_email: blazer@example.org
slack_webhook_url: <%= ENV["BLAZER_SLACK_WEBHOOK_URL"] %>
slack_oauth_token: <%= ENV["BLAZER_SLACK_OAUTH_TOKEN"] %>
check_schedules:
  - "1 day"
  - "1 hour"
anomaly_checks: prophet
forecasting: trend
async: true
images: true
override_csp: true
mapbox_access_token: <%= ENV["MAPBOX_ACCESS_TOKEN"] %>
uploads:
  url: <%= ENV["BLAZER_UPLOADS_URL"] %>
  schema: uploads
  data_source: main
