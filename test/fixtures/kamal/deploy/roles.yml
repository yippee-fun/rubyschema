# yaml-language-server: $schema=../../../../dist/kamal/deploy.json
%YAML 1.1
---
service: myapp
image: myapp/web
labels:
  my-label: my-value
registry:
  server: localhost:5555
servers:
  web:
    - 172.1.0.1
    - 172.1.0.2: experiment1
    - 172.1.0.3: [experiment1, experiment2]
  workers:
    hosts:
      - 172.1.0.4
      - 172.1.0.5: experiment1
    cmd: bin/jobs
    stop_timeout: 30
    options:
      memory: 2g
      cpus: 4
      restart: on-failure:5
    logging:
      options:
        max-size: 50m
    proxy:
      app_port: 4000
      path_prefixes:
        - /jobs
      strip_path_prefix: false
    labels:
      my-label: workers
    env:
      clear:
        QUEUE: default
    asset_path: /public
  api:
    hosts:
      - 172.1.0.6
    proxy: true
env:
  clear:
    DB_USER: app
  secret:
    - DB_PASSWORD:MAIN_DB_PASSWORD
  tags:
    experiment1:
      FEATURE_FLAG: "on"
    experiment2:
      clear:
        MYSQL_USER: readonly
      secret:
        - READONLY_PASSWORD
proxy:
  hosts:
    - foo.example.com
    - bar.example.com
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  ssl_redirect: false
  forward_headers: true
  path_prefix: "/api,/oauth_callback"
  logging:
    request_headers:
      - Cache-Control
    response_headers:
      - X-Request-ID
  run:
    http_port: 8080
    https_port: 8443
    metrics_port: 9090
    debug: true
    log_max_size: 30m
    bind_ips:
      - 0.0.0.0
    registry: registry:4443
    repository: myrepo/kamal-proxy
    version: v0.9.2
    options:
      memory: 512m
asset_path: /rails/public/assets:ro
hooks_path: .kamal/hooks
hooks_output:
  pre-deploy: ":verbose"
  pre-build: quiet
secrets_path: .kamal/secrets
error_pages_path: public
require_destination: true
primary_role: web
allow_empty_roles: false
retain_containers: 3
minimum_version: 2.12.0
readiness_delay: 4
deploy_timeout: 10
drain_timeout: 10
stop_timeout: 30
run_directory: .kamal
ssh:
  user: app
  port: 2222
  proxy: root@proxy-host
  log_level: debug
  keys:
    - ~/.ssh/id.pem
  key_data:
    - SSH_PRIVATE_KEY
  config:
    - ~/.ssh/myconfig
  forward_agent: false
sshkit:
  max_concurrent_starts: 10
  pool_idle_timeout: 300
  dns_retries: 0
builder:
  arch: arm64
  remote: ssh://docker@docker-builder
  local: false
  pack:
    builder: heroku/builder:24
    buildpacks:
      - heroku/ruby
      - heroku/procfile
  cache:
    type: gha
    options: mode=max
  args:
    RUBY_VERSION: 3.4
  ssh: default=$SSH_AUTH_SOCK
  driver: docker
  provenance: false
  sbom: true
accessories:
  mysql:
    service: mysql
    image: mysql:8.0
    registry:
      server: ghcr.io
      username:
        - GHCR_USERNAME
      password:
        - GHCR_PASSWORD
    tags:
      - writer
    cmd: bin/mysqld
    port: 3306
    labels:
      app: myapp
    options:
      restart: always
    files:
      - config/my.cnf.erb:/etc/mysql/my.cnf
      - local: config/secret.key
        remote: /etc/mysql/secret.key
        mode: "0600"
        owner: "mysql:mysql"
    directories:
      - local: mysql-data
        remote: /var/lib/mysql
        mode: "0750"
        options: z
    network: custom
    proxy:
      host: db.example.com
      app_port: 8080
boot:
  limit: 25%
  wait: 10
  parallel_roles: true
output:
  otel:
    endpoint: http://otel-gateway:4318
  file:
    path: /var/log/kamal/
aliases:
  console: app exec -i --reuse "bin/rails console"
  staging_deploy: deploy -d staging
x-shared:
  anything: goes
